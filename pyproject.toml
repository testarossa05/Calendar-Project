[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calhub"
version = "0.1.0"
description = "Unify calendars scattered across Outlook/Teams, Notion, Google and iCloud into one."
requires-python = ">=3.11"
dependencies = [
    "icalendar>=6.0",
    "recurring-ical-events>=3.2",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "PyYAML>=6.0",
    "caldav>=1.3",
    "msal>=1.31",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "pyobjc-framework-EventKit>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
calhub = "calhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
