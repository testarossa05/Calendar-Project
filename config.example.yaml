# calhub configuration
#
# Copy to config.yaml and fill in. config.yaml is git-ignored.
# Never put a token or password directly in this file: write ${ENV_VAR} instead
# and set the variable in your shell or as a GitHub Actions secret.

timezone: Asia/Seoul
back_days: 14          # keep this much recent history in the unified calendar
forward_days: 120      # and this much of the future
dedupe: true           # collapse the same meeting arriving from two sources

# Entries shorter than this are reminders, not commitments. 0 disables the filter.
drop_shorter_than_minutes: 0

# --- safety valves -----------------------------------------------------------
# Refuse to publish a merge when a source failed, so a broken Outlook link cannot
# silently erase work meetings from the unified calendar.
allow_partial: false
# Refuse a run that would delete more than this share of the target calendar.
max_delete_ratio: 0.5
delete_guard_min_events: 10


sources:
  # ---------------------------------------------------------------------------
  # 1. Microsoft 365 / Teams
  #
  # Pick ONE of the three routes below. They are ordered by how much they need
  # from the tenant, least first. Teams meetings live in the Outlook calendar, so
  # reading that calendar is all that is required.
  # ---------------------------------------------------------------------------

  # 1a. Microsoft Graph -- delegated Calendars.Read on your own mailbox.
  #     Worth trying even when "Publish a calendar" is blocked: publishing is
  #     governed by Exchange's SharingPolicy, app registration by Entra ID's
  #     "users can register applications". They are separate settings.
  #     Set up:  python -m calhub ms-auth --client-id <id> --tenant-id <tenant>
  - id: outlook
    kind: msgraph
    priority: 10          # lower number wins a duplicate; work calendar is truth
    client_id: ${MS_CLIENT_ID}
    tenant_id: ${MS_TENANT_ID}
    token_cache: ${MS_TOKEN_CACHE}
    prefix: "[Work] "
    skip_declined: true
    # privacy: busy       # mirror only the time, never the subject

  # 1b. macOS EventKit -- reads calendars already synced to this Mac.
  #     Needs nothing from the tenant at all: it reads what the approved Outlook
  #     or Calendar.app client has already downloaded. Runs only on macOS, and
  #     only while the Mac is awake.
  #     Requires: pip install pyobjc-framework-EventKit
  # - id: outlook
  #   kind: eventkit
  #   priority: 10
  #   calendars: ["Calendar"]     # omit to read every local calendar
  #   prefix: "[Work] "

  # 1c. Published ICS link -- simplest, but blocked by policy in many tenants.
  #     Outlook web -> Settings -> Calendar -> Shared calendars -> Publish a calendar
  # - id: outlook
  #   kind: ics
  #   priority: 10
  #   url: ${OUTLOOK_ICS_URL}
  #   prefix: "[Work] "

  # ---------------------------------------------------------------------------
  # 2. Notion -- via the API (richer than Notion's own ICS export).
  #    Create an integration at notion.so/my-integrations, then open the database
  #    and use ... -> Connections -> add that integration.
  # ---------------------------------------------------------------------------
  - id: notion
    kind: notion
    priority: 50
    token: ${NOTION_TOKEN}
    database_id: ${NOTION_DATABASE_ID}
    date_property: Date            # the date column, spelled exactly as in Notion
    # title_property: Name         # omit to auto-detect the title column
    # location_property: Location
    # description_properties: [Status, Owner, Opportunity]
    prefix: "[Notion] "

  # Alternative: Notion without the API, using a view's ICS link.
  # - id: notion
  #   kind: ics
  #   priority: 50
  #   url: ${NOTION_ICS_URL}

  # ---------------------------------------------------------------------------
  # 3. Google Calendar (read side)
  # ---------------------------------------------------------------------------
  - id: gcal-personal
    kind: google
    priority: 30
    calendar_id: ${GOOGLE_SOURCE_CALENDAR_ID}
    service_account_json: ${GOOGLE_SERVICE_ACCOUNT_JSON}
    skip_declined: true

  # ---------------------------------------------------------------------------
  # 4. Anniversaries, birthdays and day-count milestones from a local file.
  #
  #    This covers calendars that cannot be exported at all. Between (비트윈) has
  #    a shared calendar and anniversary tracker but publishes no ICS feed, no
  #    API and no external sync, so its entries cannot be pulled out by any
  #    supported means. Declare the dates that matter in events.yaml instead.
  #
  #    For couple schedules that change often, a Google calendar shared with your
  #    partner is the better answer: add it as another 'google' source above and
  #    both of you can edit it. See docs/SETUP-ko.md section 2.5.
  # ---------------------------------------------------------------------------
  - id: family
    kind: local
    priority: 20
    file: events.yaml           # copy events.example.yaml -> events.yaml
    prefix: "[가족] "

  # ---------------------------------------------------------------------------
  # 5. iCloud -- CalDAV. Requires an app-specific password from appleid.apple.com,
  #    not your Apple ID password.
  # ---------------------------------------------------------------------------
  - id: icloud
    kind: caldav
    priority: 40
    enabled: false                 # turn on once the app-specific password is set
    url: https://caldav.icloud.com/
    username: ${ICLOUD_USERNAME}
    password: ${ICLOUD_APP_PASSWORD}
    # calendars: ["Home", "Family"]   # omit to read every calendar


sinks:
  # ---------------------------------------------------------------------------
  # A. A single merged .ics file.
  #    Host it (GitHub Pages works and is free) and subscribe on the iPhone:
  #    Settings -> Calendar -> Accounts -> Add Account -> Other
  #      -> Add Subscribed Calendar -> paste the URL
  #    No Apple Developer account and no App Store review involved.
  # ---------------------------------------------------------------------------
  - kind: ics_file
    # PUBLISH_SLUG is a long random string (openssl rand -hex 16). An .ics
    # subscription URL cannot be authenticated -- the phone fetches it anonymously --
    # so an unguessable path is the only thing protecting it. Pair it with
    # `privacy: busy` on the work source before publishing anywhere public.
    path: public/${PUBLISH_SLUG}/unified.ics
    calendar_name: "Key - Unified"
    refresh_interval: PT15M        # hint to iOS for how often to re-fetch

  # ---------------------------------------------------------------------------
  # C. Mirror into a Notion database.
  #    Create one with the right schema in a single command:
  #      calhub notion-setup --parent-page <page url or id>
  #    Or point the *_property options at an existing database's column names.
  #    Pages written carry a key and a content hash, so a rerun updates rather
  #    than duplicates; a page without a key was made by hand and is left alone.
  # ---------------------------------------------------------------------------
  - kind: notion
    enabled: false
    database_id: ${NOTION_TARGET_DATABASE_ID}
    token: ${NOTION_TOKEN}
    # title_property: Name
    # date_property: Date
    # source_property: Source
    # location_property: Location
    # key_property: "calhub Key"
    # hash_property: "calhub Hash"

  # ---------------------------------------------------------------------------
  # B. Mirror into a dedicated Google calendar.
  #    Create an EMPTY calendar for this. Events written here carry a private
  #    marker; anything you add by hand is never touched. Still, a calendar used
  #    only as a mirror keeps the blast radius at zero.
  # ---------------------------------------------------------------------------
  - kind: google
    enabled: false
    calendar_id: ${GOOGLE_TARGET_CALENDAR_ID}
    service_account_json: ${GOOGLE_SERVICE_ACCOUNT_JSON}
    # Google colour ids are '1'..'11'.
    source_colors:
      outlook: "11"
      notion: "5"
      gcal-personal: "7"
      family: "4"
      icloud: "10"
